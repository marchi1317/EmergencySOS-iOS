name: EmergencySOS iOS Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show macOS and Xcode
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: List project files
        run: |
          echo "=== EmergencySOS files ==="
          find . -maxdepth 4 -type f -print

      - name: Check project generation tools
        run: |
          echo "=== Checking tools ==="
          command -v xcodegen || true
          command -v tuist || true
          command -v brew || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build iOS project
        run: |
          xcodebuild \
            -project EmergencySOS.xcodeproj \
            -scheme EmergencySOS \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone Device project
        run: |
              xcodebuild \
               -project EmergencySOS.xcodeproj \
               -scheme EmergencySOS \
               -sdk iphoneos \
               -configuration Debug \
               CODE_SIGNING_ALLOWED=NO \
               build
       
      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: EmergencySOS-iOS-Simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/EmergencySOS.app
          if-no-files-found: error

      - name: Upload iPhone Device app
        uses: actions/upload-artifact@v4
        with:
          name: EmergencySOS-iPhone-Device
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/EmergencySOS.app
          if-no-files-found: error
